name: "Basic SD1.5"
description: "Basic SD1.5"
workflow_file: "basic_sd15.json"
prefix_filename: "comfy-bot-basic-sd15-"
flags:
  res:
    description: "Resolution heightxwidth"
    json_path:
      - ["5", "inputs", "height"]
      - ["5", "inputs", "width"]
    data_type: integer
    value_splitter: "x"
    default: "512x512"
  batch:
    description: "The batch size"
    json_path:
      - ["5", "inputs", "batch_size"]
    data_type: integer
    default: 1
  steps:
    description: "Number of steps"
    json_path:
      - ["3", "inputs", "steps"]
    data_type: integer
    default: 20
  seed:
    description: "The seed value"
    json_path:
      - ["3", "inputs", "seed"]
    data_type: integer
    default: "random"
  cfg:
    description: "The CFG value"
    json_path:
      - ["3", "inputs", "cfg"]
    data_type: float
    default: 8.0
  ckpt:
    description: "The checkpoint to use"
    json_path:
      - ["4", "inputs", "ckpt_name"]
    data_type: string
    default: "v1-5-pruned-emaonly-fp16.safetensors"
  sampler:
    description: "The sampler to use"
    json_path:
      - ["3", "inputs", "sampler_name"]
    data_type: string
    default: "euler"
  schd:
    description: "The scheduler to use"
    json_path:
      - ["3", "inputs", "scheduler"]
    data_type: string
    default: "normal"
  positive-prompt:
    description: "The primary prompt"
    json_path:
      - ["6", "inputs", "text"]
    data_type: string
    is_implicit: true
  negative-prompt:
    description: "The negative prompt"
    json_path:
      - ["7", "inputs", "text"]
    data_type: string
    is_implicit: true
  filesave:
    description: "Node prefix"
    json_path:
      - ["save_image", "inputs", "filename_prefix"]
    data_type: string
    is_implicit: true
